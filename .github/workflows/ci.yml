name: CI Build Check (SidOS)

on:
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "yarn"

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Prebuild Virtual Filesystem
        run: yarn build:prebuild

      - name: Run Linter, Stylelint & Type Check
        run: |
          yarn lint
          yarn stylelint
          npx tsc --noEmit

      - name: Run Unit Tests
        run: yarn test

      - name: Build Static Export
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Chromium)
        run: yarn e2e --project=chromium --workers=2
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
